[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pureagents"
dynamic = ["version"]
description = "LLM agents without the complexity. Just agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Jose Manuel Flores Barranco", email = "jose@ederspark.com" }
]
keywords = ["llm", "agents", "ai", "mistral", "openai", "anthropic", "tools", "function-calling", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://pureagents.dev"
Documentation = "https://pureagents.dev/docs"
Repository = "https://github.com/jmbarrancoml/pureagents"
Issues = "https://github.com/jmbarrancoml/pureagents/issues"
Changelog = "https://github.com/jmbarrancoml/pureagents/releases"

[tool.hatch.version]
path = "src/pure_agents/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pure_agents"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
